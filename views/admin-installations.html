<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pages Proxy Admin Dashboard</title>
  <style>
    :root {
      --bg: #f4efe6;
      --surface: rgba(255, 252, 246, 0.92);
      --surface-strong: #fffaf0;
      --text: #1f1c17;
      --muted: #6a6154;
      --accent: #b5542f;
      --accent-soft: rgba(181, 84, 47, 0.12);
      --border: rgba(31, 28, 23, 0.12);
      --shadow: 0 24px 60px rgba(92, 57, 34, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(181, 84, 47, 0.22), transparent 36%),
        radial-gradient(circle at top right, rgba(88, 125, 91, 0.16), transparent 28%),
        linear-gradient(180deg, #f7f1e8 0%, var(--bg) 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .shell {
      max-width: 1300px;
      margin: 0 auto;
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero {
      padding: 36px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(255,255,255,0.82), rgba(255,244,230,0.92));
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 0.96;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      padding: 24px 36px;
      background: rgba(255,255,255,0.35);
    }

    .summary-card {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface-strong);
    }

    .summary-label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .summary-value {
      font-size: 1.8rem;
      color: var(--accent);
    }

    .table-wrap {
      overflow-x: auto;
      padding: 0 24px 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      background: rgba(255,255,255,0.52);
      position: sticky;
      top: 0;
    }

    tbody tr:hover {
      background: var(--accent-soft);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 720px) {
      .hero,
      .summary-grid,
      .table-wrap {
        padding-left: 18px;
        padding-right: 18px;
      }

      body {
        padding: 18px 12px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>Pages Proxy Installation State</h1>
      <p class="subtitle">Generated {{GENERATED_AT}}</p>
    </section>
    <section class="summary-grid">
      {{SUMMARY_CARDS}}
    </section>
    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Installation ID</th>
            <th>Account</th>
            <th>Account Type</th>
            <th>Lifecycle</th>
            <th>Config</th>
            <th>Repo Selection</th>
            <th>Setup Completed</th>
            <th>Last Setup View</th>
            <th>Last Webhook</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {{INSTALLATION_ROWS}}
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
